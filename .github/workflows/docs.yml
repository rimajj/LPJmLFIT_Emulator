# Documenter.jl build + doctests + linkcheck + versioned GitHub Pages deploy
# (ENGINEERING_STANDARDS.md §3 and §4). Documenter is the single source of truth.
#
# `docs/make.jl` MUST call makedocs(...) with `doctest = true` and
# `linkcheck = true` (and `warnonly` OFF) so the doc<->code consistency gate and
# the linkcheck run inside the build. The explicit doctest step below is a
# belt-and-braces re-run so doctest failures surface even on PRs from forks.
name: docs
#
# DELIBERATELY NOT triggered on `line/**` (ADR 0028), unlike CI/format/python: this workflow holds
# `permissions: contents: write` and deploys the built site to the `gh-pages` branch, so running it on four
# parallel line branches would race that branch. Work lines build docs LOCALLY instead:
#   DOCS_LINKCHECK=false julia --project=docs docs/make.jl
# (already the documented local check — CLAUDE.md §2). Do not add `line/**` here.

# WHEN THIS RUNS (ADR 0090): only when the Documenter page tree or the package
# source (docstrings are pulled from it) changed. Note what is deliberately NOT here:
# `docs/component_s_public_report.{tex,pdf}`, `docs/figs/**` and `docs/decisions/**`
# are all under `docs/` but are NOT part of the Documenter build — no `docs/src` page
# includes them, and make.jl's linkcheck ignores the GitHub self-links that reference
# the ADRs — so changing them cannot affect this gate.
on:
  push:
    branches:
      - main
    tags: ['*']
    paths:
      - 'docs/src/**'
      - 'docs/make.jl'
      - 'docs/Project.toml'
      - 'src/**'
      - 'Project.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/src/**'
      - 'docs/make.jl'
      - 'docs/Project.toml'
      - 'src/**'
      - 'Project.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Deploy needs write access to push the built site to the gh-pages branch;
# statuses/pull-requests let Documenter post preview links on PRs.
permissions:
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    # Headless GR backend so figure-generating @example blocks work on CI.
    env:
      GKSwstype: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate docs environment
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'
      - name: Run doctests
        run: |
          julia --project=docs -e '
            using Documenter
            using LPJmLFITEmulator
            DocMeta.setdocmeta!(
                LPJmLFITEmulator, :DocTestSetup, :(using LPJmLFITEmulator);
                recursive = true,
            )
            doctest(LPJmLFITEmulator)'
      - name: Build, linkcheck and deploy docs
        uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
