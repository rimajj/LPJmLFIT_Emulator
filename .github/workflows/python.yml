# Python prototype checks (ENGINEERING_STANDARDS.md §3): lint, format, tests.
# The prototype is uv-managed and lives under python/.
name: python

# WHEN THIS RUNS (ADR 0090): only when `python/**` changed. Every step of this job
# executes with `working-directory: python`, and `ruff check .` / `pytest` therefore
# only ever see that subtree — `scripts/*.py` is NOT linted or tested here, so a
# change outside `python/` cannot alter this gate's result.
on:
  push:
    branches:
      - main
      - 'line/**'   # parallel work lines (ADR 0028) — CI on every line branch
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    # All `run` steps execute inside python/ where pyproject.toml / uv.lock live.
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: python
      - name: Sync environment (frozen to uv.lock)
        # --frozen installs exactly the committed uv.lock (no re-resolve), so CI is
        # reproducible and a floating major can't sneak in (root cause of the prior failure).
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest
