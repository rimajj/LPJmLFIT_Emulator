# Julia package tests + coverage (ENGINEERING_STANDARDS.md §3).
# Required branch-protection checks (name them exactly): `test (lts)` and `test (1)`.
# The `test (pre)` job is allowed to fail; the macOS job is an extra platform gate.
name: CI

# WHEN THIS RUNS (ADR 0090). This workflow is the expensive gate — four Julia jobs
# (lts, 1, pre, macOS) at ~10 min each. It runs ONLY when something it can actually
# test has changed. A docs-, prose-, skill-, ADR- or handoff-only commit does not
# affect any Julia code path, so running it there is pure cost and delay.
# `workflow_dispatch` is the escape hatch: any gate can be forced from the Actions
# tab (or `gh workflow run`) when you want it regardless of the paths touched.
on:
  push:
    branches:
      - main
      - 'line/**'   # parallel work lines (ADR 0028) — CI on every line branch
    tags: ['*']
    paths:
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'Project.toml'
      # Diagram fixtures. `test/testitems/diagram_registry_tests.jl` regenerates these from
      # src/registry.jl and fails on any difference (ADR 0091). NB this comment described an
      # INTENDED gate for months while no test actually compared them — which is how
      # docs/src/generated/components.mmd stayed stale for weeks. It is now true.
      - 'docs/src/generated/**'
      - '.github/workflows/CI.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'Project.toml'
      - 'docs/src/generated/**'
      - '.github/workflows/CI.yml'
  workflow_dispatch:

# Cancel superseded runs on a branch/PR, but never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # NOTE: do not set a static `name:` here — GitHub auto-generates the matrix
  # names `test (lts)`, `test (1)`, `test (pre)` from the job id + `version`.
  test:
    runs-on: ubuntu-latest
    # `pre` (upcoming Julia prerelease) is allowed to fail.
    continue-on-error: ${{ matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'   # long-term-support Julia (currently 1.10, per Project.toml compat) — REQUIRED
          - '1'     # latest released Julia 1.x — REQUIRED
          - 'pre'   # upcoming Julia prerelease — allowed to fail
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          annotate: true
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  # One extra platform: macOS (Apple Silicon) on the LTS Julia. Not a required
  # check; keep its name distinct from the `test (...)` matrix jobs.
  test-macos:
    name: test (macOS, lts)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'lts'
          arch: aarch64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          annotate: true
